<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal de Solicitudes de Pago</title>
 
<style>
body{
font-family: Arial, sans-serif;
background:#f5f5f5;
margin:0;
padding:20px;
}
 
.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,0.1);
}
 
h1{
text-align:center;
color:#c00000;
margin-bottom:30px;
}
 
.form-group{
margin-bottom:20px;
}
 
label{
display:block;
margin-bottom:6px;
font-weight:bold;
color:#c00000;
}
 
input, select, textarea{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}
 
textarea{
min-height:120px;
resize:vertical;
}
 
.required{
color:red;
}
 
button{
background:#c00000;
color:white;
border:none;
padding:14px 30px;
border-radius:5px;
font-size:16px;
cursor:pointer;
}
 
button:hover{
background:#990000;
}
 
.info{
background:#fff4f4;
border-left:5px solid #c00000;
padding:10px;
margin-bottom:25px;
}
</style>
</head>
 
<body>
 
<div class="container">
 
<h1>Solicitud de Gestión de Pagos</h1>
 
<div class="info">
Por favor complete todos los campos obligatorios marcados con (*).
</div>
 
<form>
 
<div class="form-group">
<label>Tipo de solicitud *</label>
<select required>
<option value="">Seleccione...</option>
<option>Pago de factura vencida</option>
<option>Pago internacional</option>
<option>Pago urgente de agricultores de soja, ganaderos o transportistas</option>
<option>Pago de factura no vencida</option>
<option>Solicitud detalle de pago</option>
<option>Reclamación de confirming</option>
<option>Solicitud de justificante de pago</option>
<option>Otros</option>
</select>
</div>
 
<div class="form-group">
<label>Sociedad *</label>
<select required>
<option value="">Seleccione una sociedad...</option>
<option>Sociedad 1</option>
<option>Sociedad 2</option>
<option>Sociedad 3</option>
</select>
</div>
 
<div class="form-group">
<label>CIF proveedor *</label>
<input type="text" required>
</div>
 
<div class="form-group">
<label>CIF sociedad *</label>
<input type="text" required>
</div>
 
<div class="form-group">
<label>Nombre proveedor *</label>
<input type="text" required>
</div>
 
<div class="form-group">
<label>Número factura</label>
<input type="text">
</div>
 
<div class="form-group">
<label>Importe (€)</label>
<input type="number" step="0.01">
</div>
 
<div class="form-group">
<label>Motivo</label>
<textarea placeholder="Indique el detalle de la solicitud"></textarea>
</div>
 
<div class="form-group">
<label>Adjuntos</label>
<input type="file" multiple
accept=".pdf,.jpg,.jpeg,.png,.xlsx,.xls,.doc,.docx">
<small>
Se permiten facturas, albaranes, justificantes, recibos,
contratos y solicitudes.
</small>
</div>
 
<button type="submit">
Enviar Solicitud
</button>
 
</form>
 
</div>
 
</body>
</html>
